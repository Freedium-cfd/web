name: freedium-obs

services:
  wgcf:
    build:
      context: ./wgcf-warp
    deploy:
      # NOTE: scaling this UP does NOT add exit-IP diversity — Cloudflare
      # WARP (free) funnels every tunnel through ~2 shared IPv4 egress IPs
      # (104.28.x.x), so 20 replicas saw the same 2 IPs as 3. Worse, 20
      # privileged WireGuard tunnels + healthchecks saturated the 4-vCPU
      # box (load avg >90, OOM) and took production down. Keep this small.
      # Real per-IP-soft-block resilience needs a residential/datacenter
      # proxy pool, not more WARP tunnels.
      replicas: 3
    networks:
      - freedium_obs_net
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      # Needed so `modprobe wireguard` / `ip6table_raw` inside the container
      # can find the host's kernel modules — without this wg-quick fails to
      # bring the wgcf interface up.
      - /lib/modules:/lib/modules:ro
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    healthcheck:
      test: ["CMD-SHELL", "curl -fs --max-time 3 https://www.cloudflare.com/cdn-cgi/trace | grep -q -E 'warp=(on|plus)' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  haproxy-pb:
    build:
      context: ../proxy-balancer
    depends_on:
      wgcf:
        # service_started (not service_healthy) so the stack still comes up
        # in environments where Warp's UDP handshake completes but data
        # plane is throttled (e.g. some ISPs filter Cloudflare WARP return
        # traffic). HAProxy itself has `check` on each backend slot so it
        # routes only to replicas actually answering.
        condition: service_started
    networks:
      - freedium_obs_net
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: freedium-library/Dockerfile
    # No container_name: runs as 2 replicas behind Traefik (rolling, zero-
    # downtime deploys; one replica can die without an outage). 2 uvicorn
    # workers each → ~same total worker count as the old single ×4, but split
    # across replicas so a recreate never drops all of them.
    command: ["uvicorn", "freedium_library.api.app:app", "--host", "0.0.0.0", "--port", "7080", "--workers", "2", "--log-level", "warning"]
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 900m
    environment:
      - ERROR_LOG_PATH=/var/log/freedium/errored-links.jsonl
      - PDF_INTERNAL_SECRET=${PDF_INTERNAL_SECRET:-dev-secret-change-me}
      - API_PDF_INTERNAL_SECRET=${PDF_INTERNAL_SECRET:-dev-secret-change-me}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=${MONGO_DB:-freedium_cache}
      - MONGO_COLLECTION=${MONGO_COLLECTION:-post_cache}
      - REDIS_URL=redis://redis:6379/0
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
      - WARP_PROXY_BALANCER=${WARP_PROXY_BALANCER:-${PROXY_LIST:-socks5://haproxy-pb:1080}}
      - PROXY_LIST=${WARP_PROXY_BALANCER:-${PROXY_LIST:-socks5://haproxy-pb:1080}}
      - IMAGE_SERVE_MODE=redirect
      - TRACEMALLOC=${TRACEMALLOC:-0}
      - MEDIUM_ENABLED=${MEDIUM_ENABLED:-true}
      # NYT (dark by default). Flip NYT_ENABLED=true once smoke-tested.
      # NYT_SIGNING_KEY lives in stack/.env (gitignored), never committed.
      # No NYT-S cookie needed — article content is public (client-side paywall).
      - WAPO_ENABLED=${WAPO_ENABLED:-false}
      - ATHLETIC_ENABLED=${ATHLETIC_ENABLED:-false}
      - ATHLETIC_MDREAM_URL=http://mdream:8085
      - FT_ENABLED=${FT_ENABLED:-false}
      - ECONOMIST_ENABLED=${ECONOMIST_ENABLED:-false}
      - REUTERS_ENABLED=${REUTERS_ENABLED:-false}
      - BBG_ENABLED=${BBG_ENABLED:-false}
      - NYT_ENABLED=${NYT_ENABLED:-false}
      - NYT_SIGNING_KEY=${NYT_SIGNING_KEY:-}
      - NYT_MDREAM_URL=http://mdream:8085
    volumes:
      - errored_logs:/var/log/freedium
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      haproxy-pb:
        condition: service_started
    networks:
      - freedium_obs_net
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=freedium-obs_freedium_obs_net
      - traefik.http.services.backend.loadbalancer.server.port=7080
      - traefik.http.services.backend.loadbalancer.healthcheck.path=/healthz
      - traefik.http.services.backend.loadbalancer.healthcheck.interval=10s
      # Internal API entrypoint (web → here). Matches everything; not public.
      - traefik.http.routers.backend-api.entrypoints=backendapi
      - traefik.http.routers.backend-api.rule=PathPrefix(`/`)
      - traefik.http.routers.backend-api.service=backend

  mongo:
    image: mongo:7
    container_name: freedium-mongo
    command:
      - "--quiet"
      - "--logpath=/dev/null"
      - "--wiredTigerCollectionBlockCompressor=zstd"
      - "--wiredTigerJournalCompressor=zstd"
      - "--wiredTigerCacheSizeGB=0.5"
    volumes:
      - mongo_data:/data/db
    networks:
      - freedium_obs_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1200m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5

  traefik:
    image: traefik:v3.5
    container_name: freedium-traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      # Trust X-Forwarded-* from the edge HAProxy + private ranges so
      # SvelteKit sees the real client IP and original https scheme.
      # Narrow default: edge HAProxy + loopback + Docker's default bridge
      # range only. Operators on other bridge subnets (e.g. user-defined
      # networks outside 172.16/12) MUST pin EDGE_PROXY_CIDR explicitly.
      - "--entrypoints.web.forwardedHeaders.trustedIPs=${EDGE_PROXY_CIDR:-127.0.0.1/32,146.103.108.112/32,172.16.0.0/12}"
      - "--entrypoints.metrics.address=:8082"
      # Internal-only entrypoint for web → backend API. Not published to the
      # host, so it's reachable only on the container network (edge HAProxy
      # never forwards here). web uses http://traefik:7090.
      - "--entrypoints.backendapi.address=:7090"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      # Docker provider: discovers backend replicas (labels) for health-gated
      # load balancing. opt-in (exposedByDefault=false) so only labelled
      # services are routed.
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entryPoint=metrics"
      - "--accesslog=true"
      - "--accesslog.format=json"
    ports:
      # Exotic ingress port so the stack runs on a host whose 80/443
      # are claimed by another proxy (e.g. Coolify). The edge HAProxy
      # at 146.103.108.112 forwards public 80/443 → <host>:18080.
      - "${WEB_INGRESS_PORT:-18080}:80"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - freedium_obs_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: freedium-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - freedium_obs_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ..
      dockerfile: freedium-library/Dockerfile
    container_name: freedium-worker
    deploy:
      resources:
        limits:
          memory: 900m
    command:
      - python3
      - -m
      - freedium_library.tasks.start_worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=${MONGO_DB:-freedium_cache}
      - MONGO_COLLECTION=${MONGO_COLLECTION:-post_cache}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - ERROR_LOG_PATH=/var/log/freedium/errored-links.jsonl
      - WARP_PROXY_BALANCER=${WARP_PROXY_BALANCER:-${PROXY_LIST:-socks5://haproxy-pb:1080}}
      - PROXY_LIST=${WARP_PROXY_BALANCER:-${PROXY_LIST:-socks5://haproxy-pb:1080}}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
      - JXL_BATCH_SIZE=100
      - JXL_PARALLEL=2
      - JXL_MIN_BYTES=50000
    expose:
      - "8079"
    volumes:
      - errored_logs:/var/log/freedium
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      haproxy-pb:
        condition: service_started
    networks:
      - freedium_obs_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8079/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  scheduler:
    build:
      context: ..
      dockerfile: freedium-library/Dockerfile
    container_name: freedium-scheduler
    command: ["taskiq", "scheduler", "freedium_library.tasks:scheduler"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=${MONGO_DB:-freedium_cache}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - freedium_obs_net
    restart: unless-stopped

  web:
    build:
      context: ../new-web
      dockerfile: Dockerfile
    deploy:
      replicas: 3
    environment:
      # API via Traefik internal entrypoint (:7090), NOT backend directly.
      # Traefik load-balances + health-checks the 2 backend replicas, and web
      # holds keep-alive connections to the stable Traefik endpoint — so a
      # backend recreate (new replica IP) never strands web with dead sockets.
      - PUBLIC_API_BASE_URL=http://traefik:7090
      - PUBLIC_API_URL=http://traefik:7090/api
      - PDF_INTERNAL_SECRET=${PDF_INTERNAL_SECRET:-dev-secret-change-me}
      - PDF_SERVICE_URL=http://traefik:7090/api
      - PDF_SERVICE_SECRET=${PDF_INTERNAL_SECRET:-dev-secret-change-me}
    depends_on:
      backend:
        condition: service_healthy
      traefik:
        condition: service_started
    networks:
      - freedium_obs_net
    restart: unless-stopped

  mdream:
    build:
      context: ../mdream-svc
    container_name: freedium-mdream
    environment:
      - PORT=8085
    networks:
      - freedium_obs_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8085/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: freedium-cadvisor
    command:
      - "--housekeeping_interval=30s"
      - "--docker_only=true"
      - "--store_container_labels=false"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    expose:
      - "8080"
    networks:
      - freedium_obs_net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: freedium-prometheus
    # Prometheus runs as nobody; add the host docker group (GID 990) so it can
    # read the socket for backend replica discovery (docker_sd_configs).
    group_add:
      - "990"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro  # backend replica discovery
    networks:
      - freedium_obs_net
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.0
    container_name: freedium-loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - freedium_obs_net
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.3.0
    container_name: freedium-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - errored_logs:/var/log/freedium:ro
      - promtail_data:/var/lib/promtail
      # Read-only Docker socket for container log discovery (worker state etc.)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - freedium_obs_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: freedium-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_DEFAULT_THEME=dark
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_ANON_ENABLED:-false}
      # Grafana is served under /grafana via an SSH tunnel, so tell it
      # its served-from path and let it serve from a sub-path.
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    # Bind to 127.0.0.1 ONLY on the host — never publicly reachable.
    # Operators open it locally with an SSH tunnel:
    #   ssh -L 3001:127.0.0.1:3001 root@95.216.173.21
    # then browse http://localhost:3001 (login: admin / GF_ADMIN_PASSWORD).
    ports:
      - "127.0.0.1:${GRAFANA_LOCAL_PORT:-3001}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - freedium_obs_net
    restart: unless-stopped

networks:
  freedium_obs_net:
    driver: bridge

volumes:
  prom_data:
  loki_data:
  grafana_data:
  promtail_data:
  errored_logs:
  mongo_data:
